name: Unsigned Electron release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      OPENCODE_CHANNEL: dev
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: opencode
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run desktop:build
      - name: Calculate checksums
        shell: pwsh
        run: |
          Get-ChildItem opencode/packages/desktop/dist -File -Filter *.exe |
            ForEach-Object {
              $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$digest  $($_.Name)"
            } | Set-Content opencode/packages/desktop/dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: second-brain-os-unsigned-windows
          path: |
            opencode/packages/desktop/dist/*.exe
            opencode/packages/desktop/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
