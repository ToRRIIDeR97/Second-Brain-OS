name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: opencode
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - if: runner.os == 'Linux'
        run: bun run --cwd opencode/packages/app playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: bun run test:routes
      - run: bun run build
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: opencode
      - run: git config --global user.name "Second Brain CI"
      - run: git config --global user.email "ci@second-brain.invalid"
      - run: bun run test:engine
        env:
          GITHUB_ACTIONS: "false"
