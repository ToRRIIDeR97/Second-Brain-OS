  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahr" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahs" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="e" d="M0,0 L10,5 L0,10"/></marker>
  <marker id="dm" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="bar" d="M1,6 L6,1 L11,6 L6,11 z"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="1080" height="870"/>
<text x="20" y="28" text-anchor="start" class="h">Class view</text>
<text x="20" y="46" text-anchor="start" class="s">UML 2.5.1 class diagram · filled diamond = composition · schema/src, core/src, opencode/src · fields abridged</text>
<rect class="box" x="20" y="84" width="230" height="95" rx="3"/>
<text x="135.0" y="102" text-anchor="middle" class="s">«core table»</text>
<text x="135.0" y="116" text-anchor="middle" class="t">Project</text>
<line class="e" x1="20" y1="124" x2="250" y2="124"/>
<text x="28" y="140" text-anchor="start" class="s">id</text>
<text x="28" y="155" text-anchor="start" class="s">worktree</text>
<text x="28" y="170" text-anchor="start" class="s">directories[]</text>
<rect class="box" x="280" y="84" width="230" height="95" rx="3"/>
<text x="395.0" y="102" text-anchor="middle" class="s">«durable»</text>
<text x="395.0" y="116" text-anchor="middle" class="t">Event</text>
<line class="e" x1="280" y1="124" x2="510" y2="124"/>
<text x="288" y="140" text-anchor="start" class="s">aggregate_id = sessionID</text>
<text x="288" y="155" text-anchor="start" class="s">seq (unique per aggregate)</text>
<text x="288" y="170" text-anchor="start" class="s">type (versioned)</text>
<rect class="box" x="540" y="84" width="230" height="81" rx="3"/>
<text x="655.0" y="102" text-anchor="middle" class="t">PermissionRule</text>
<line class="e" x1="540" y1="110" x2="770" y2="110"/>
<text x="548" y="126" text-anchor="start" class="s">action, resource (wildcards)</text>
<text x="548" y="141" text-anchor="start" class="s">effect: allow | ask | deny</text>
<text x="548" y="156" text-anchor="start" class="s">saved rows: allow only</text>
<rect class="box" x="800" y="84" width="240" height="95" rx="3"/>
<text x="920.0" y="102" text-anchor="middle" class="s">«schema»</text>
<text x="920.0" y="116" text-anchor="middle" class="t">Location</text>
<line class="e" x1="800" y1="124" x2="1040" y2="124"/>
<text x="808" y="140" text-anchor="start" class="s">directory: AbsolutePath</text>
<text x="808" y="155" text-anchor="start" class="s">workspaceID?</text>
<text x="808" y="170" text-anchor="start" class="s">project {id, directory}</text>
<rect class="box" x="20" y="240" width="230" height="111" rx="3"/>
<text x="135.0" y="258" text-anchor="middle" class="t">Session</text>
<line class="e" x1="20" y1="266" x2="250" y2="266"/>
<text x="28" y="282" text-anchor="start" class="s">id, projectID, workspaceID?</text>
<text x="28" y="297" text-anchor="start" class="s">directory, parentID?</text>
<text x="28" y="312" text-anchor="start" class="s">harnessInstanceID, harnessModel?</text>
<text x="28" y="327" text-anchor="start" class="s">harnessRevision</text>
<text x="28" y="342" text-anchor="start" class="s">harnessContinuation?</text>
<rect class="box" x="280" y="240" width="230" height="110" rx="3"/>
<text x="395.0" y="258" text-anchor="middle" class="s">«union»</text>
<text x="395.0" y="272" text-anchor="middle" class="t">SessionMessage</text>
<line class="e" x1="280" y1="280" x2="510" y2="280"/>
<text x="288" y="296" text-anchor="start" class="s">seq (= durable event seq)</text>
<text x="288" y="311" text-anchor="start" class="s">User | Assistant | System |</text>
<text x="288" y="326" text-anchor="start" class="s">Shell | Synthetic | Compaction |</text>
<text x="288" y="341" text-anchor="start" class="s">AgentSwitched | ModelSwitched</text>
<rect class="box" x="540" y="240" width="230" height="95" rx="3"/>
<text x="655.0" y="258" text-anchor="middle" class="s">«in memory»</text>
<text x="655.0" y="272" text-anchor="middle" class="t">PermissionRequest</text>
<line class="e" x1="540" y1="280" x2="770" y2="280"/>
<text x="548" y="296" text-anchor="start" class="s">id per_…, sessionID</text>
<text x="548" y="311" text-anchor="start" class="s">action, resources[], save[]</text>
<text x="548" y="326" text-anchor="start" class="s">source? {messageID, callID}</text>
<rect class="box" x="800" y="240" width="240" height="126" rx="3"/>
<text x="920.0" y="258" text-anchor="middle" class="t">BrainProject</text>
<line class="e" x1="800" y1="266" x2="1040" y2="266"/>
<text x="808" y="282" text-anchor="start" class="s">id project_&lt;ULID&gt;, name (unique)</text>
<text x="808" y="297" text-anchor="start" class="s">outcome, instructions</text>
<text x="808" y="312" text-anchor="start" class="s">status: active|paused|archived</text>
<text x="808" y="327" text-anchor="start" class="s">progressPercent 0..100</text>
<text x="808" y="342" text-anchor="start" class="s">location? {workspaceId, path}</text>
<text x="808" y="357" text-anchor="start" class="s">card: projects/&lt;id&gt;/project.md</text>
<rect class="box" x="20" y="470" width="230" height="81" rx="3"/>
<text x="135.0" y="488" text-anchor="middle" class="t">SessionInput</text>
<line class="e" x1="20" y1="496" x2="250" y2="496"/>
<text x="28" y="512" text-anchor="start" class="s">id (= User message id)</text>
<text x="28" y="527" text-anchor="start" class="s">delivery: steer | queue</text>
<text x="28" y="542" text-anchor="start" class="s">admitted_seq, promoted_seq?</text>
<rect class="box" x="280" y="470" width="230" height="81" rx="3"/>
<text x="395.0" y="488" text-anchor="middle" class="t">AssistantContent</text>
<line class="e" x1="280" y1="496" x2="510" y2="496"/>
<text x="288" y="512" text-anchor="start" class="s">Text | Reasoning | Tool</text>
<text x="288" y="527" text-anchor="start" class="s">Tool.state: ToolState</text>
<text x="288" y="542" text-anchor="start" class="s">snapshot {start, end, files}</text>
<rect class="box" x="540" y="470" width="230" height="111" rx="3"/>
<text x="655.0" y="488" text-anchor="middle" class="t">HarnessInstance</text>
<line class="e" x1="540" y1="496" x2="770" y2="496"/>
<text x="548" y="512" text-anchor="start" class="s">id, driver: opencode|codex|acp</text>
<text x="548" y="527" text-anchor="start" class="s">status: available|unavailable</text>
<text x="548" y="542" text-anchor="start" class="s">models[]</text>
<text x="548" y="557" text-anchor="start" class="s">source: built-in | harnesses.json</text>
<text x="548" y="572" text-anchor="start" class="s">| config harnesses</text>
<rect class="box" x="800" y="470" width="240" height="111" rx="3"/>
<text x="920.0" y="488" text-anchor="middle" class="t">KnowledgeNote</text>
<line class="e" x1="800" y1="496" x2="1040" y2="496"/>
<text x="808" y="512" text-anchor="start" class="s">path notes/**.md or</text>
<text x="808" y="527" text-anchor="start" class="s">projects/&lt;id&gt;/notes/**.md</text>
<text x="808" y="542" text-anchor="start" class="s">title, tags[], links[]</text>
<text x="808" y="557" text-anchor="start" class="s">projectIds[]</text>
<text x="808" y="572" text-anchor="start" class="s">revision = sha256(raw)</text>
<rect class="box" x="280" y="690" width="230" height="81" rx="3"/>
<text x="395.0" y="708" text-anchor="middle" class="t">Task</text>
<line class="e" x1="280" y1="716" x2="510" y2="716"/>
<text x="288" y="732" text-anchor="start" class="s">id, title, dueDate?, scheduledDate?</text>
<text x="288" y="747" text-anchor="start" class="s">completedAt? (open if unset)</text>
<text x="288" y="762" text-anchor="start" class="s">projectId?, source, syncState</text>
<rect class="box" x="540" y="690" width="230" height="81" rx="3"/>
<text x="655.0" y="708" text-anchor="middle" class="t">CalendarEvent</text>
<line class="e" x1="540" y1="716" x2="770" y2="716"/>
<text x="548" y="732" text-anchor="start" class="s">id, title, date, start?/end?</text>
<text x="548" y="747" text-anchor="start" class="s">projectId?</text>
<text x="548" y="762" text-anchor="start" class="s">source: local | google, syncState</text>
<rect class="box" x="800" y="690" width="240" height="81" rx="3"/>
<text x="920.0" y="708" text-anchor="middle" class="t">CalendarSnapshot</text>
<line class="e" x1="800" y1="716" x2="1040" y2="716"/>
<text x="808" y="732" text-anchor="start" class="s">version 2, revision (ULID)</text>
<text x="808" y="747" text-anchor="start" class="s">.second-brain/calendar-v1.json</text>
<text x="808" y="762" text-anchor="start" class="s">events ≤ 5000, tasks ≤ 5000</text>
