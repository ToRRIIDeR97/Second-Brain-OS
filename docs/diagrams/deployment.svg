<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="title desc">
<title id="title">Deployment view of Second Brain OS</title>
<desc id="desc">UML deployment view: the user's machine runs the Electron main, renderer and utility-process server, optional harness processes and CLI daemon, with userData, XDG data and workspace artifacts, plus external services.</desc>

<style>
  .bg{fill:#ffffff}
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
  .t{font-weight:600}
  .s{font-size:11.5px;fill:#57606a}
  .h{font-size:16px;font-weight:600}
  .lbl{font-size:11px;fill:#424a53}
  .lblbg{fill:#ffffff;opacity:.92}
  .box{fill:#f6f8fa;stroke:#57606a;stroke-width:1.2}
  .sub{fill:#ffffff;stroke:#8c959f;stroke-width:1}
  .store{fill:#fff8e5;stroke:#9a6700;stroke-width:1.2}
  .ext{fill:#ddf4ff;stroke:#0969da;stroke-width:1.2}
  .proc{fill:#fbefff;stroke:#8250df;stroke-width:1.2}
  .zone{fill:none;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:7 5}
  .zonet{font-size:12px;font-weight:600;fill:#57606a}
  .gapz{fill:#fff1f0;stroke:#cf222e;stroke-width:1.2}
  .e{fill:none;stroke:#57606a;stroke-width:1.3}
  .d{stroke-dasharray:5 4}
  .r{stroke:#cf222e}
  .sens{stroke:#bc4c00;stroke-width:2}
  .ah{fill:#57606a}
  .ahr{fill:#cf222e}
  .ahs{fill:#bc4c00}
  .life{stroke:#8c959f;stroke-width:1;stroke-dasharray:4 4}
  .act{fill:#eaeef2;stroke:#57606a;stroke-width:1}
  .frag{fill:none;stroke:#8c959f;stroke-width:1}
  .fragt{fill:#eaeef2;stroke:#8c959f;stroke-width:1}
  .dot{fill:#1f2328}
  .ring{fill:none;stroke:#1f2328;stroke-width:1.5}
  .dia{fill:#ffffff;stroke:#57606a;stroke-width:1.2}
  .bar{fill:#1f2328}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    text{fill:#e6edf3}
    .s{fill:#9198a1} .lbl{fill:#c9d1d9} .lblbg{fill:#0d1117}
    .box{fill:#161b22;stroke:#8b949e} .sub{fill:#0d1117;stroke:#6e7681}
    .store{fill:#2b2111;stroke:#d29922} .ext{fill:#0c2d4a;stroke:#4493f8}
    .proc{fill:#271a3d;stroke:#ab7df8}
    .zone{stroke:#6e7681} .zonet{fill:#9198a1}
    .gapz{fill:#3a1517;stroke:#f85149}
    .e{stroke:#9198a1} .r{stroke:#f85149} .sens{stroke:#f0883e}
    .ah{fill:#9198a1} .ahr{fill:#f85149} .ahs{fill:#f0883e}
    .life{stroke:#6e7681} .act{fill:#21262d;stroke:#8b949e}
    .frag{stroke:#6e7681} .fragt{fill:#21262d;stroke:#6e7681}
    .dot{fill:#e6edf3} .ring{stroke:#e6edf3} .dia{fill:#0d1117;stroke:#8b949e} .bar{fill:#e6edf3}
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahr" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahs" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="e" d="M0,0 L10,5 L0,10"/></marker>
  <marker id="dm" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="bar" d="M1,6 L6,1 L11,6 L6,11 z"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="1000" height="640"/>
<text x="20" y="28" text-anchor="start" class="h">Deployment view</text>
<text x="20" y="46" text-anchor="start" class="s">UML 2.5.1 deployment diagram · unsigned development candidates; auto-update disabled</text>
<rect class="zone" x="20" y="70" width="740" height="555" rx="10"/>
<text x="30" y="86" text-anchor="start" class="zonet">«device» user machine</text>
<rect class="zone" x="40" y="100" width="450" height="300" rx="10"/>
<text x="50" y="116" text-anchor="start" class="zonet">«executionEnvironment» Electron app</text>
<rect class="box" x="60" y="130" width="200" height="86" rx="6"/>
<text x="70" y="148" text-anchor="start" class="s">«process»</text>
<text x="70" y="164" text-anchor="start" class="t">Main process</text>
<text x="70" y="180" text-anchor="start" class="s">out/main/index.js</text>
<text x="70" y="196" text-anchor="start" class="s">app id ai.opencode.desktop.*</text>
<rect class="box" x="270" y="130" width="200" height="86" rx="6"/>
<text x="280" y="148" text-anchor="start" class="s">«process»</text>
<text x="280" y="164" text-anchor="start" class="t">Renderer process</text>
<text x="280" y="180" text-anchor="start" class="s">oc://renderer/index.html</text>
<text x="280" y="196" text-anchor="start" class="s">out/preload/index.js</text>
<rect class="box" x="60" y="240" width="410" height="70" rx="6"/>
<text x="70" y="258" text-anchor="start" class="t">Utility process “opencode server”</text>
<text x="70" y="274" text-anchor="start" class="s">virtual:opencode-server = opencode/dist/node/node.js</text>
<text x="70" y="290" text-anchor="start" class="s">listens on 127.0.0.1:&lt;ephemeral&gt;</text>
<rect class="sub" x="60" y="322" width="200" height="64" rx="6"/>
<text x="70" y="340" text-anchor="start" class="t">OAuth loopback server</text>
<text x="70" y="356" text-anchor="start" class="s">127.0.0.1:0, ≤5 min</text>
<rect class="sub" x="270" y="322" width="200" height="64" rx="6"/>
<text x="280" y="340" text-anchor="start" class="t">opencode-cli daemon</text>
<text x="280" y="356" text-anchor="start" class="s">opt-in v2, dev channel only</text>
<rect class="proc" x="510" y="100" width="230" height="76" rx="6"/>
<text x="520" y="118" text-anchor="start" class="t">Harness processes</text>
<text x="520" y="134" text-anchor="start" class="s">codex app-server, ACP agents</text>
<text x="520" y="150" text-anchor="start" class="s">spawned by server, stdio</text>
<text x="520" y="166" text-anchor="start" class="s">cwd = workspace</text>
<rect class="proc" x="510" y="190" width="230" height="50" rx="6"/>
<text x="520" y="208" text-anchor="start" class="t">WSL sidecars</text>
<text x="520" y="224" text-anchor="start" class="s">Windows only, optional</text>
<rect class="store" x="40" y="430" width="230" height="182" rx="6"/>
<text x="50" y="448" text-anchor="start" class="t">userData = appData/&lt;appId&gt;</text>
<text x="50" y="464" text-anchor="start" class="s">opencode.settings, opencode.updater</text>
<text x="50" y="480" text-anchor="start" class="s">second-brain.google</text>
<text x="50" y="496" text-anchor="start" class="s">drafts.sqlite (+wal/shm)</text>
<text x="50" y="512" text-anchor="start" class="s">window-state-&lt;id&gt;.json</text>
<text x="50" y="528" text-anchor="start" class="s">logs/&lt;stamp&gt;/, Crashpad/</text>
<text x="50" y="544" text-anchor="start" class="s">opencode/ server state</text>
<text x="50" y="560" text-anchor="start" class="s">(XDG_STATE_HOME default)</text>
<text x="50" y="576" text-anchor="start" class="s">cli/&lt;ver&gt;/opencode-cli (v2)</text>
<rect class="store" x="290" y="430" width="200" height="100" rx="6"/>
<text x="300" y="448" text-anchor="start" class="t">XDG data/opencode</text>
<text x="300" y="464" text-anchor="start" class="s">auth.json, mcp-auth.json</text>
<text x="300" y="480" text-anchor="start" class="s">profile SQLite, snapshots</text>
<rect class="store" x="290" y="545" width="200" height="64" rx="6"/>
<text x="300" y="563" text-anchor="start" class="t">Global config dir</text>
<text x="300" y="579" text-anchor="start" class="s">harnesses.json</text>
<rect class="store" x="510" y="430" width="230" height="90" rx="6"/>
<text x="520" y="448" text-anchor="start" class="t">Workspace directories</text>
<text x="520" y="464" text-anchor="start" class="s">notes/, projects/</text>
<text x="520" y="480" text-anchor="start" class="s">.second-brain/</text>
<rect class="ext" x="800" y="100" width="180" height="60" rx="6"/>
<text x="810" y="118" text-anchor="start" class="t">Google APIs</text>
<text x="810" y="134" text-anchor="start" class="s">oauth2, calendar v3,</text>
<text x="810" y="150" text-anchor="start" class="s">tasks v1</text>
<rect class="ext" x="800" y="180" width="180" height="60" rx="6"/>
<text x="810" y="198" text-anchor="start" class="t">LLM provider APIs</text>
<text x="810" y="214" text-anchor="start" class="s">opencode driver, agents</text>
<rect class="ext" x="800" y="260" width="180" height="50" rx="6"/>
<text x="810" y="278" text-anchor="start" class="t">System browser</text>
<rect class="sub" x="800" y="340" width="180" height="118" rx="6"/>
<text x="810" y="358" text-anchor="start" class="t">Build host</text>
<text x="810" y="374" text-anchor="start" class="s">bun run desktop:build</text>
<text x="810" y="390" text-anchor="start" class="s">prebuild: build-node.ts</text>
<text x="810" y="406" text-anchor="start" class="s">electron-builder,</text>
<text x="810" y="422" text-anchor="start" class="s">publish: null →</text>
<text x="810" y="438" text-anchor="start" class="s">installer + SHA-256</text>
<path class="e " d="M260,172 L270,172" marker-end="url(#a)"/>
<path class="e " d="M160,216 L160,240" marker-end="url(#a)"/>
<path class="e " d="M370,216 L370,240" marker-end="url(#a)"/>
<path class="e " d="M60,150 L30,150 L30,62 L785,62 L785,125 L800,125" marker-end="url(#a)"/>
<path class="e " d="M470,252 L495,252 L495,135 L510,135" marker-end="url(#a)"/>
<path class="e " d="M470,266 L775,266 L775,210 L800,210" marker-end="url(#a)"/>
<path class="e d" d="M740,150 L765,150 L765,195 L800,195" marker-end="url(#a)"/>
<path class="e " d="M800,285 L790,285 L790,415 L160,415 L160,386" marker-end="url(#a)"/>
<path class="e " d="M470,296 L625,296 L625,430" marker-end="url(#a)"/>
<rect class="lblbg" x="170.2" y="222.0" width="29.6" height="13" rx="2"/>
<text class="lbl" x="185" y="232" text-anchor="middle">fork</text>
<rect class="lblbg" x="377.5" y="222.0" width="65.0" height="13" rx="2"/>
<text class="lbl" x="410" y="232" text-anchor="middle">HTTP + SSE</text>
<rect class="lblbg" x="343.8" y="56.0" width="212.5" height="13" rx="2"/>
<text class="lbl" x="450" y="66" text-anchor="middle">HTTPS: OAuth token, Calendar, Tasks</text>
<rect class="lblbg" x="622.2" y="250.0" width="35.5" height="13" rx="2"/>
<text class="lbl" x="640" y="260" text-anchor="middle">HTTPS</text>
<rect class="lblbg" x="393.2" y="401.0" width="153.5" height="13" rx="2"/>
<text class="lbl" x="470" y="411" text-anchor="middle">redirect /oauth2/callback</text>
<rect class="lblbg" x="598.4" y="320.0" width="53.2" height="13" rx="2"/>
<text class="lbl" x="625" y="330" text-anchor="middle">file I/O</text>
</svg>
