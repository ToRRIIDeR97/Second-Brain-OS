<text x="370" y="124" text-anchor="start" class="s">native /api: server + protocol pkgs</text>
<text x="370" y="140" text-anchor="start" class="s">legacy: opencode/src/server</text>
<text x="370" y="156" text-anchor="start" class="s">Basic auth, workspace routing</text>
<text x="370" y="172" text-anchor="start" class="s">→ domains and SessionV2</text>
