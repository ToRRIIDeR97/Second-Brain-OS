<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 790" width="980" height="790" role="img" aria-labelledby="title desc">
<title id="title">Component view of Second Brain OS</title>
<desc id="desc">UML component view: Solid renderer, preload bridge, Electron main, the bundled OpenCode server with HTTP API, Second Brain domains, location services and agent runtime, plus stores and external services.</desc>

<style>
  .bg{fill:#ffffff}
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
  .t{font-weight:600}
  .s{font-size:11.5px;fill:#57606a}
  .h{font-size:16px;font-weight:600}
  .lbl{font-size:11px;fill:#424a53}
  .lblbg{fill:#ffffff;opacity:.92}
  .box{fill:#f6f8fa;stroke:#57606a;stroke-width:1.2}
  .sub{fill:#ffffff;stroke:#8c959f;stroke-width:1}
  .store{fill:#fff8e5;stroke:#9a6700;stroke-width:1.2}
  .ext{fill:#ddf4ff;stroke:#0969da;stroke-width:1.2}
  .proc{fill:#fbefff;stroke:#8250df;stroke-width:1.2}
  .zone{fill:none;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:7 5}
  .zonet{font-size:12px;font-weight:600;fill:#57606a}
  .gapz{fill:#fff1f0;stroke:#cf222e;stroke-width:1.2}
  .e{fill:none;stroke:#57606a;stroke-width:1.3}
  .d{stroke-dasharray:5 4}
  .r{stroke:#cf222e}
  .sens{stroke:#bc4c00;stroke-width:2}
  .ah{fill:#57606a}
  .ahr{fill:#cf222e}
  .ahs{fill:#bc4c00}
  .life{stroke:#8c959f;stroke-width:1;stroke-dasharray:4 4}
  .act{fill:#eaeef2;stroke:#57606a;stroke-width:1}
  .frag{fill:none;stroke:#8c959f;stroke-width:1}
  .fragt{fill:#eaeef2;stroke:#8c959f;stroke-width:1}
  .dot{fill:#1f2328}
  .ring{fill:none;stroke:#1f2328;stroke-width:1.5}
  .dia{fill:#ffffff;stroke:#57606a;stroke-width:1.2}
  .bar{fill:#1f2328}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    text{fill:#e6edf3}
    .s{fill:#9198a1} .lbl{fill:#c9d1d9} .lblbg{fill:#0d1117}
    .box{fill:#161b22;stroke:#8b949e} .sub{fill:#0d1117;stroke:#6e7681}
    .store{fill:#2b2111;stroke:#d29922} .ext{fill:#0c2d4a;stroke:#4493f8}
    .proc{fill:#271a3d;stroke:#ab7df8}
    .zone{stroke:#6e7681} .zonet{fill:#9198a1}
    .gapz{fill:#3a1517;stroke:#f85149}
    .e{stroke:#9198a1} .r{stroke:#f85149} .sens{stroke:#f0883e}
    .ah{fill:#9198a1} .ahr{fill:#f85149} .ahs{fill:#f0883e}
    .life{stroke:#6e7681} .act{fill:#21262d;stroke:#8b949e}
    .frag{stroke:#6e7681} .fragt{fill:#21262d;stroke:#6e7681}
    .dot{fill:#e6edf3} .ring{stroke:#e6edf3} .dia{fill:#0d1117;stroke:#8b949e} .bar{fill:#e6edf3}
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahr" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahs" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="e" d="M0,0 L10,5 L0,10"/></marker>
  <marker id="dm" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="bar" d="M1,6 L6,1 L11,6 L6,11 z"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="980" height="790"/>
<text x="20" y="28" text-anchor="start" class="h">Component view</text>
<text x="20" y="46" text-anchor="start" class="s">UML 2.5.1 component diagram · paths relative to opencode/packages/</text>
<rect class="box" x="20" y="70" width="250" height="160" rx="6"/>
<text x="30" y="88" text-anchor="start" class="s">«component»</text>
<text x="30" y="104" text-anchor="start" class="t">Solid renderer</text>
<text x="30" y="120" text-anchor="start" class="s">app/src</text>
<text x="30" y="136" text-anchor="start" class="s">routes: Home, Notes, Calendar,</text>
<text x="30" y="152" text-anchor="start" class="s">Projects, Activity, sessions</text>
<text x="30" y="168" text-anchor="start" class="s">ServerSDK + compat API (v1/v2)</text>
<text x="30" y="184" text-anchor="start" class="s">Second Brain client</text>
<rect class="box" x="20" y="280" width="250" height="64" rx="6"/>
<text x="30" y="298" text-anchor="start" class="s">«interface»</text>
<text x="30" y="314" text-anchor="start" class="t">window.api</text>
<text x="30" y="330" text-anchor="start" class="s">desktop/src/preload (contextBridge)</text>
<rect class="box" x="20" y="390" width="250" height="170" rx="6"/>
<text x="30" y="408" text-anchor="start" class="s">«component»</text>
<text x="30" y="424" text-anchor="start" class="t">Electron main</text>
<text x="30" y="440" text-anchor="start" class="s">desktop/src/main</text>
<text x="30" y="456" text-anchor="start" class="s">IPC registry (ipc.ts)</text>
<text x="30" y="472" text-anchor="start" class="s">windows + URL policy</text>
<text x="30" y="488" text-anchor="start" class="s">server launcher (server.ts)</text>
<text x="30" y="504" text-anchor="start" class="s">Google Calendar/Tasks service</text>
<text x="30" y="520" text-anchor="start" class="s">drafts, session export</text>
<rect class="store" x="20" y="590" width="200" height="60" rx="6"/>
<text x="30" y="608" text-anchor="start" class="t">userData stores</text>
<text x="30" y="624" text-anchor="start" class="s">drafts.sqlite, electron-store</text>
<text x="30" y="640" text-anchor="start" class="s">(second-brain.google)</text>
