<text x="370" y="458" text-anchor="start" class="t">Agent runtime</text>
<text x="370" y="474" text-anchor="start" class="s">core/src/session: SessionV2,</text>
<text x="370" y="490" text-anchor="start" class="s">SessionInput, SessionRunner</text>
<text x="370" y="506" text-anchor="start" class="s">core/src/harness.ts: HarnessRuntime</text>
<text x="370" y="522" text-anchor="start" class="s">drivers: opencode, codex, acp</text>
<text x="370" y="538" text-anchor="start" class="s">core/src/permission.ts: PermissionV2</text>
