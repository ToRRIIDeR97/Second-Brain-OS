<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="1100" height="900" role="img" aria-labelledby="title desc">
<title id="title">Sequence: cross-harness delegation</title>
<desc id="desc">UML sequence for one agent delegating a task to another harness: the runtime gets a scoped token for the loopback MCP endpoint, the calling agent invokes delegate_task, the server creates a child Run on the target harness, waits for its drain and returns the child's final reply.</desc>

<style>
  .bg{fill:#ffffff}
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
  .t{font-weight:600}
  .s{font-size:11.5px;fill:#57606a}
  .h{font-size:16px;font-weight:600}
  .lbl{font-size:11px;fill:#424a53}
  .lblbg{fill:#ffffff;opacity:.92}
  .box{fill:#f6f8fa;stroke:#57606a;stroke-width:1.2}
  .sub{fill:#ffffff;stroke:#8c959f;stroke-width:1}
  .store{fill:#fff8e5;stroke:#9a6700;stroke-width:1.2}
  .ext{fill:#ddf4ff;stroke:#0969da;stroke-width:1.2}
  .proc{fill:#fbefff;stroke:#8250df;stroke-width:1.2}
  .zone{fill:none;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:7 5}
  .zonet{font-size:12px;font-weight:600;fill:#57606a}
  .gapz{fill:#fff1f0;stroke:#cf222e;stroke-width:1.2}
  .e{fill:none;stroke:#57606a;stroke-width:1.3}
  .d{stroke-dasharray:5 4}
  .r{stroke:#cf222e}
  .sens{stroke:#bc4c00;stroke-width:2}
  .ah{fill:#57606a}
  .ahr{fill:#cf222e}
  .ahs{fill:#bc4c00}
  .life{stroke:#8c959f;stroke-width:1;stroke-dasharray:4 4}
  .act{fill:#eaeef2;stroke:#57606a;stroke-width:1}
  .frag{fill:none;stroke:#8c959f;stroke-width:1}
  .fragt{fill:#eaeef2;stroke:#8c959f;stroke-width:1}
  .dot{fill:#1f2328}
  .ring{fill:none;stroke:#1f2328;stroke-width:1.5}
  .dia{fill:#ffffff;stroke:#57606a;stroke-width:1.2}
  .bar{fill:#1f2328}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    text{fill:#e6edf3}
    .s{fill:#9198a1} .lbl{fill:#c9d1d9} .lblbg{fill:#0d1117}
    .box{fill:#161b22;stroke:#8b949e} .sub{fill:#0d1117;stroke:#6e7681}
    .store{fill:#2b2111;stroke:#d29922} .ext{fill:#0c2d4a;stroke:#4493f8}
    .proc{fill:#271a3d;stroke:#ab7df8}
    .zone{stroke:#6e7681} .zonet{fill:#9198a1}
    .gapz{fill:#3a1517;stroke:#f85149}
    .e{stroke:#9198a1} .r{stroke:#f85149} .sens{stroke:#f0883e}
    .ah{fill:#9198a1} .ahr{fill:#f85149} .ahs{fill:#f0883e}
    .life{stroke:#6e7681} .act{fill:#21262d;stroke:#8b949e}
    .frag{stroke:#6e7681} .fragt{fill:#21262d;stroke:#6e7681}
    .dot{fill:#e6edf3} .ring{stroke:#e6edf3} .dia{fill:#0d1117;stroke:#8b949e} .bar{fill:#e6edf3}
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahr" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahs" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="e" d="M0,0 L10,5 L0,10"/></marker>
  <marker id="dm" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="bar" d="M1,6 L6,1 L11,6 L6,11 z"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="1100" height="900"/>
<text x="20" y="28" text-anchor="start" class="h">Sequence: cross-harness delegation</text>
<text x="20" y="46" text-anchor="start" class="s">core/src/harness.ts · harness/delegation.ts · harness/delegation-tasks.ts · session.ts</text>
<rect class="box" x="0.0" y="64" width="160" height="44" rx="6"/>
<text x="80.0" y="82" text-anchor="middle" class="t">HarnessRuntime</text>
<text x="80.0" y="98" text-anchor="middle" class="s">caller's runtime</text>
<line class="life" x1="80" y1="108" x2="80" y2="880"/>
<rect class="box" x="170.0" y="64" width="160" height="44" rx="6"/>
<text x="250.0" y="82" text-anchor="middle" class="t">Calling agent</text>
<text x="250.0" y="98" text-anchor="middle" class="s">Claude Code (ACP) or Codex</text>
<line class="life" x1="250" y1="108" x2="250" y2="880"/>
<rect class="box" x="350.0" y="64" width="160" height="44" rx="6"/>
<text x="430.0" y="82" text-anchor="middle" class="t">Delegation endpoint</text>
<text x="430.0" y="98" text-anchor="middle" class="s">127.0.0.1 MCP</text>
<line class="life" x1="430" y1="108" x2="430" y2="880"/>
<rect class="box" x="530.0" y="64" width="160" height="44" rx="6"/>
<text x="610.0" y="82" text-anchor="middle" class="t">Delegation tasks</text>
<text x="610.0" y="98" text-anchor="middle" class="s">server layer</text>
<line class="life" x1="610" y1="108" x2="610" y2="880"/>
<rect class="box" x="710.0" y="64" width="160" height="30" rx="6"/>
<text x="790.0" y="82" text-anchor="middle" class="t">SessionV2</text>
<line class="life" x1="790" y1="94" x2="790" y2="880"/>
<rect class="box" x="900.0" y="64" width="160" height="44" rx="6"/>
<text x="980.0" y="82" text-anchor="middle" class="t">Target harness</text>
<text x="980.0" y="98" text-anchor="middle" class="s">e.g. Codex</text>
<line class="life" x1="980" y1="108" x2="980" y2="880"/>
<path class="e " d="M80,140 L430,140" marker-end="url(#a)"/>
<rect class="frag" x="40" y="160" width="1030" height="100"/>
<path class="fragt" d="M40,160 h38.5 v12 l-8,8 h-30.5 z"/>
<text x="46" y="174" text-anchor="start" class="t">alt</text>
<text x="86.5" y="175" text-anchor="start" class="s">[ACP agent advertises mcpCapabilities.http]</text>
<line class="frag d" x1="40" y1="212" x2="1070" y2="212" style="stroke-dasharray:6 4"/>
<text x="48" y="227" text-anchor="start" class="s">[Codex]</text>
<path class="e " d="M80,200 L250,200" marker-end="url(#a)"/>
<path class="e " d="M80,248 L250,248" marker-end="url(#a)"/>
<path class="e " d="M250,300 L430,300" marker-end="url(#a)"/>
<path class="e " d="M250,346 L430,346" marker-end="url(#a)"/>
<path class="e " d="M430,376 L610,376" marker-end="url(#a)"/>
<path class="e d " d="M610,406 L250,406" marker-end="url(#o)"/>
<path class="e " d="M250,452 L430,452" marker-end="url(#a)"/>
<path class="e " d="M430,482 L610,482" marker-end="url(#a)"/>
<path class="e " d="M610,496 L650,496 L650,512 L612,512" marker-end="url(#a)"/>
<path class="e " d="M610,546 L790,546" marker-end="url(#a)"/>
<path class="e " d="M610,576 L790,576" marker-end="url(#a)"/>
<path class="e " d="M790,606 L980,606" marker-end="url(#a)"/>
<path class="e d " d="M980,646 L790,646" marker-end="url(#o)"/>
<rect class="frag" x="40" y="670" width="1030" height="110"/>
<path class="fragt" d="M40,670 h38.5 v12 l-8,8 h-30.5 z"/>
<text x="46" y="684" text-anchor="start" class="t">alt</text>
<text x="86.5" y="685" text-anchor="start" class="s">[child finishes within wait_seconds]</text>
<line class="frag d" x1="40" y1="728" x2="1070" y2="728" style="stroke-dasharray:6 4"/>
<text x="48" y="743" text-anchor="start" class="s">[still running]</text>
<path class="e d " d="M610,712 L250,712" marker-end="url(#o)"/>
<path class="e d " d="M610,762 L250,762" marker-end="url(#o)"/>
<path class="e " d="M80,820 L120,820 L120,836 L82,836" marker-end="url(#a)"/>
<rect class="lblbg" x="125.1" y="125.0" width="259.7" height="13" rx="2"/>
<text class="lbl" x="255.0" y="135" text-anchor="middle">endpoint(sessionID) → token (runtime scope)</text>
<rect class="lblbg" x="79.4" y="185.0" width="171.2" height="13" rx="2"/>
<text class="lbl" x="165.0" y="195" text-anchor="middle">session/new + tenon (Bearer)</text>
<rect class="lblbg" x="67.6" y="233.0" width="194.8" height="13" rx="2"/>
<text class="lbl" x="165.0" y="243" text-anchor="middle">-c mcp_servers.tenon · token env</text>
<rect class="lblbg" x="239.6" y="285.0" width="200.7" height="13" rx="2"/>
<text class="lbl" x="340.0" y="295" text-anchor="middle">POST /mcp initialize · tools/list</text>
<rect class="lblbg" x="272.1" y="331.0" width="135.8" height="13" rx="2"/>
<text class="lbl" x="340.0" y="341" text-anchor="middle">tools/call list_agents</text>
<rect class="lblbg" x="452.1" y="361.0" width="135.8" height="13" rx="2"/>
<text class="lbl" x="520.0" y="371" text-anchor="middle">listAgents(caller Run)</text>
<rect class="lblbg" x="323.8" y="391.0" width="212.5" height="13" rx="2"/>
<text class="lbl" x="430.0" y="401" text-anchor="middle">harnesses + models (current marked)</text>
<rect class="lblbg" x="207.2" y="437.0" width="265.6" height="13" rx="2"/>
<text class="lbl" x="340.0" y="447" text-anchor="middle">tools/call delegate_task(agent, task, model)</text>
<rect class="lblbg" x="437.4" y="467.0" width="165.3" height="13" rx="2"/>
<text class="lbl" x="520.0" y="477" text-anchor="middle">delegate(caller Run, input)</text>
<rect class="lblbg" x="653.0" y="497.0" width="247.9" height="13" rx="2"/>
<text class="lbl" x="656" y="507" text-anchor="start">depth &lt; 2 · running &lt; 4 · agent available</text>
<rect class="lblbg" x="576.0" y="531.0" width="247.9" height="13" rx="2"/>
<text class="lbl" x="700.0" y="541" text-anchor="middle">create(parentID = caller, harness, model)</text>
<rect class="lblbg" x="573.1" y="561.0" width="253.8" height="13" rx="2"/>
<text class="lbl" x="700.0" y="571" text-anchor="middle">prompt(framed task, resume false) · resume</text>
<rect class="lblbg" x="793.5" y="591.0" width="183.0" height="13" rx="2"/>
<text class="lbl" x="885.0" y="601" text-anchor="middle">drain child Run → harness turn</text>
<rect class="lblbg" x="743.4" y="631.0" width="283.3" height="13" rx="2"/>
<text class="lbl" x="885.0" y="641" text-anchor="middle">child reply · approvals reach caller's composer</text>
<rect class="lblbg" x="320.8" y="697.0" width="218.4" height="13" rx="2"/>
<text class="lbl" x="430.0" y="707" text-anchor="middle">completed | failed: final reply text</text>
<rect class="lblbg" x="279.5" y="747.0" width="301.0" height="13" rx="2"/>
<text class="lbl" x="430.0" y="757" text-anchor="middle">running + task_id; later task_result / cancel_task</text>
<rect class="lblbg" x="123.0" y="821.0" width="183.0" height="13" rx="2"/>
<text class="lbl" x="126" y="831" text-anchor="start">runtime closes → token revoked</text>
</svg>
