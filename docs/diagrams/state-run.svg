<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" width="1060" height="640" role="img" aria-labelledby="title desc">
<title id="title">State machines: runs, inputs, tools and steps</title>
<desc id="desc">UML state machines for the run coordinator entry, prompt input rows, tool parts and assistant steps in the agent runtime.</desc>

<style>
  .bg{fill:#ffffff}
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
  .t{font-weight:600}
  .s{font-size:11.5px;fill:#57606a}
  .h{font-size:16px;font-weight:600}
  .lbl{font-size:11px;fill:#424a53}
  .lblbg{fill:#ffffff;opacity:.92}
  .box{fill:#f6f8fa;stroke:#57606a;stroke-width:1.2}
  .sub{fill:#ffffff;stroke:#8c959f;stroke-width:1}
  .store{fill:#fff8e5;stroke:#9a6700;stroke-width:1.2}
  .ext{fill:#ddf4ff;stroke:#0969da;stroke-width:1.2}
  .proc{fill:#fbefff;stroke:#8250df;stroke-width:1.2}
  .zone{fill:none;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:7 5}
  .zonet{font-size:12px;font-weight:600;fill:#57606a}
  .gapz{fill:#fff1f0;stroke:#cf222e;stroke-width:1.2}
  .e{fill:none;stroke:#57606a;stroke-width:1.3}
  .d{stroke-dasharray:5 4}
  .r{stroke:#cf222e}
  .sens{stroke:#bc4c00;stroke-width:2}
  .ah{fill:#57606a}
  .ahr{fill:#cf222e}
  .ahs{fill:#bc4c00}
  .life{stroke:#8c959f;stroke-width:1;stroke-dasharray:4 4}
  .act{fill:#eaeef2;stroke:#57606a;stroke-width:1}
  .frag{fill:none;stroke:#8c959f;stroke-width:1}
  .fragt{fill:#eaeef2;stroke:#8c959f;stroke-width:1}
  .dot{fill:#1f2328}
  .ring{fill:none;stroke:#1f2328;stroke-width:1.5}
  .dia{fill:#ffffff;stroke:#57606a;stroke-width:1.2}
  .bar{fill:#1f2328}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    text{fill:#e6edf3}
    .s{fill:#9198a1} .lbl{fill:#c9d1d9} .lblbg{fill:#0d1117}
    .box{fill:#161b22;stroke:#8b949e} .sub{fill:#0d1117;stroke:#6e7681}
    .store{fill:#2b2111;stroke:#d29922} .ext{fill:#0c2d4a;stroke:#4493f8}
    .proc{fill:#271a3d;stroke:#ab7df8}
    .zone{stroke:#6e7681} .zonet{fill:#9198a1}
    .gapz{fill:#3a1517;stroke:#f85149}
    .e{stroke:#9198a1} .r{stroke:#f85149} .sens{stroke:#f0883e}
    .ah{fill:#9198a1} .ahr{fill:#f85149} .ahs{fill:#f0883e}
    .life{stroke:#6e7681} .act{fill:#21262d;stroke:#8b949e}
    .frag{stroke:#6e7681} .fragt{fill:#21262d;stroke:#6e7681}
    .dot{fill:#e6edf3} .ring{stroke:#e6edf3} .dia{fill:#0d1117;stroke:#8b949e} .bar{fill:#e6edf3}
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahr" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahs" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="e" d="M0,0 L10,5 L0,10"/></marker>
  <marker id="dm" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path class="bar" d="M1,6 L6,1 L11,6 L6,11 z"/></marker>
</defs>

<rect class="bg" x="0" y="0" width="1060" height="640"/>
<text x="20" y="28" text-anchor="start" class="h">State machines: run execution</text>
<text x="20" y="46" text-anchor="start" class="s">UML 2.5.1 state machine diagrams · core/src/session, schema/src/session-message.ts</text>
<rect class="zone" x="20" y="60" width="500" height="280" rx="10"/>
<text x="30" y="76" text-anchor="start" class="zonet">Run coordinator entry · run-coordinator.ts</text>
<circle class="dot" cx="50" cy="140" r="8"/>
<rect class="box" x="80" y="123" width="120" height="34" rx="14"/>
<text x="140.0" y="144.0" text-anchor="middle">Absent</text>
<rect class="box" x="310" y="123" width="130" height="44" rx="14"/>
<text x="375.0" y="143.0" text-anchor="middle" class="t">Running</text>
<text x="375.0" y="158.0" text-anchor="middle" class="s">owner drain fiber</text>
<rect class="box" x="310" y="260" width="130" height="34" rx="14"/>
<text x="375.0" y="281.0" text-anchor="middle">Stopping</text>
<path class="e " d="M58,140 L80,140" marker-end="url(#a)"/>
<path class="e " d="M200,132 L310,132" marker-end="url(#a)"/>
<path class="e " d="M310,158 L200,158" marker-end="url(#a)"/>
<path class="e " d="M355,123 L355,96 L405,96 L405,123" marker-end="url(#a)"/>
<path class="e " d="M440,135 L480,135 L480,160 L440,160" marker-end="url(#a)"/>
<path class="e " d="M335,167 L335,260" marker-end="url(#a)"/>
<path class="e " d="M310,277 L140,277 L140,157" marker-end="url(#a)"/>
<rect class="zone" x="540" y="60" width="500" height="280" rx="10"/>
<text x="550" y="76" text-anchor="start" class="zonet">Prompt input row · session/input.ts</text>
<circle class="dot" cx="570" cy="142" r="8"/>
<rect class="box" x="600" y="120" width="140" height="44" rx="14"/>
<text x="670.0" y="140.0" text-anchor="middle" class="t">Admitted</text>
<text x="670.0" y="155.0" text-anchor="middle" class="s">promoted_seq NULL</text>
<rect class="box" x="870" y="120" width="150" height="44" rx="14"/>
<text x="945.0" y="140.0" text-anchor="middle" class="t">Promoted</text>
<text x="945.0" y="155.0" text-anchor="middle" class="s">promoted_seq set</text>
<rect class="box" x="735" y="250" width="140" height="34" rx="14"/>
<text x="805.0" y="271.0" text-anchor="middle">Removed</text>
<circle class="ring" cx="990" cy="267" r="10"/><circle class="dot" cx="990" cy="267" r="6"/>
<path class="e " d="M578,142 L600,142" marker-end="url(#a)"/>
<path class="e " d="M740,142 L870,142" marker-end="url(#a)"/>
<path class="e " d="M670,164 L670,267 L735,267" marker-end="url(#a)"/>
<path class="e " d="M945,164 L945,230 L850,230 L850,250" marker-end="url(#a)"/>
<path class="e " d="M875,267 L978,267" marker-end="url(#a)"/>
<text x="560" y="320" text-anchor="start" class="s">delivery: steer (default) | queue · reused id with a different payload → conflict</text>
<rect class="zone" x="20" y="360" width="500" height="260" rx="10"/>
<text x="30" y="376" text-anchor="start" class="zonet">Tool part · ToolState</text>
<circle class="dot" cx="50" cy="437" r="8"/>
<rect class="box" x="75" y="420" width="100" height="34" rx="14"/>
<text x="125.0" y="441.0" text-anchor="middle">pending</text>
<rect class="box" x="215" y="420" width="100" height="34" rx="14"/>
<text x="265.0" y="441.0" text-anchor="middle">running</text>
<rect class="box" x="365" y="420" width="120" height="34" rx="14"/>
<text x="425.0" y="441.0" text-anchor="middle">completed</text>
<rect class="box" x="215" y="540" width="100" height="34" rx="14"/>
<text x="265.0" y="561.0" text-anchor="middle">error</text>
<path class="e " d="M58,437 L75,437" marker-end="url(#a)"/>
<path class="e " d="M175,437 L215,437" marker-end="url(#a)"/>
<path class="e " d="M315,437 L365,437" marker-end="url(#a)"/>
<path class="e " d="M125,454 L125,557 L215,557" marker-end="url(#a)"/>
<path class="e " d="M265,454 L265,540" marker-end="url(#a)"/>
<text x="40" y="605" text-anchor="start" class="s">input.started → pending · runner fails unsettled tools on error, interrupt and decline</text>
<rect class="zone" x="540" y="360" width="500" height="260" rx="10"/>
<text x="550" y="376" text-anchor="start" class="zonet">Assistant step · message-updater.ts</text>
<circle class="dot" cx="570" cy="477" r="8"/>
<rect class="box" x="610" y="455" width="150" height="44" rx="14"/>
<text x="685.0" y="475.0" text-anchor="middle" class="t">Open</text>
<text x="685.0" y="490.0" text-anchor="middle" class="s">time.completed unset</text>
<rect class="box" x="860" y="405" width="150" height="44" rx="14"/>
<text x="935.0" y="425.0" text-anchor="middle" class="t">Completed</text>
<text x="935.0" y="440.0" text-anchor="middle" class="s">finish, tokens, files</text>
<rect class="box" x="860" y="515" width="150" height="44" rx="14"/>
<text x="935.0" y="535.0" text-anchor="middle" class="t">Failed</text>
<text x="935.0" y="550.0" text-anchor="middle" class="s">finish = error</text>
<path class="e " d="M578,477 L610,477" marker-end="url(#a)"/>
<path class="e " d="M760,470 L810,470 L810,427 L860,427" marker-end="url(#a)"/>
<path class="e " d="M760,490 L810,490 L810,537 L860,537" marker-end="url(#a)"/>
<text x="560" y="605" text-anchor="start" class="s">step.failed: provider error, interrupt, or user decline</text>
<rect class="lblbg" x="184.1" y="116.0" width="141.7" height="13" rx="2"/>
<text class="lbl" x="255" y="126" text-anchor="middle">run | wake / fork drain</text>
<rect class="lblbg" x="175.3" y="164.0" width="159.4" height="13" rx="2"/>
<text class="lbl" x="255" y="174" text-anchor="middle">drain exits [¬pendingWake]</text>
<rect class="lblbg" x="303.2" y="80.0" width="153.5" height="13" rx="2"/>
<text class="lbl" x="380" y="90" text-anchor="middle">wake / pendingWake = true</text>
<rect class="lblbg" x="397.0" y="176.0" width="112.2" height="13" rx="2"/>
<text class="lbl" x="400" y="186" text-anchor="start">exit [pendingWake,</text>
<rect class="lblbg" x="397.0" y="189.0" width="94.5" height="13" rx="2"/>
<text class="lbl" x="400" y="199" text-anchor="start">not stopping] /</text>
<rect class="lblbg" x="397.0" y="202.0" width="94.5" height="13" rx="2"/>
<text class="lbl" x="400" y="212" text-anchor="start">successor drain</text>
<rect class="lblbg" x="337.0" y="230.0" width="188.9" height="13" rx="2"/>
<text class="lbl" x="340" y="240" text-anchor="start">interrupt / pendingWake = false</text>
<rect class="lblbg" x="142.3" y="261.0" width="165.3" height="13" rx="2"/>
<text class="lbl" x="225" y="271" text-anchor="middle">drain exits; waiters re-run</text>
<rect class="lblbg" x="778.4" y="126.0" width="53.2" height="13" rx="2"/>
<text class="lbl" x="805" y="136" text-anchor="middle">prompted</text>
<rect class="lblbg" x="737.1" y="155.0" width="135.8" height="13" rx="2"/>
<text class="lbl" x="805" y="165" text-anchor="middle">[steer: at turn start]</text>
<rect class="lblbg" x="701.7" y="168.0" width="206.6" height="13" rx="2"/>
<text class="lbl" x="805" y="178" text-anchor="middle">[queue: no steer, no continuation]</text>
<rect class="lblbg" x="619.8" y="205.0" width="100.4" height="13" rx="2"/>
<text class="lbl" x="670" y="215" text-anchor="middle">revert.committed</text>
<rect class="lblbg" x="854.8" y="214.0" width="100.4" height="13" rx="2"/>
<text class="lbl" x="905" y="224" text-anchor="middle">revert.committed</text>
<rect class="lblbg" x="159.6" y="402.0" width="70.9" height="13" rx="2"/>
<text class="lbl" x="195" y="412" text-anchor="middle">tool.called</text>
<rect class="lblbg" x="301.6" y="402.0" width="76.8" height="13" rx="2"/>
<text class="lbl" x="340" y="412" text-anchor="middle">tool.success</text>
<rect class="lblbg" x="129.6" y="541.0" width="70.9" height="13" rx="2"/>
<text class="lbl" x="165" y="551" text-anchor="middle">tool.failed</text>
<rect class="lblbg" x="253.2" y="490.0" width="153.5" height="13" rx="2"/>
<text class="lbl" x="330" y="500" text-anchor="middle">tool.failed · interrupted</text>
<rect class="lblbg" x="578.8" y="435.0" width="212.5" height="13" rx="2"/>
<text class="lbl" x="685" y="445" text-anchor="middle">step.started (closes previous open)</text>
<rect class="lblbg" x="777.5" y="408.0" width="65.0" height="13" rx="2"/>
<text class="lbl" x="810" y="418" text-anchor="middle">step.ended</text>
<rect class="lblbg" x="774.5" y="550.0" width="70.9" height="13" rx="2"/>
<text class="lbl" x="810" y="560" text-anchor="middle">step.failed</text>
</svg>
