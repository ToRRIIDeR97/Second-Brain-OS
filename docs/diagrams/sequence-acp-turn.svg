<text class="lbl" x="780.0" y="369" text-anchor="middle">session/load [continuation] else session/new</text>
<rect class="lblbg" x="588.0" y="387.0" width="147.6" height="13" rx="2"/>
<text class="lbl" x="591" y="397" text-anchor="start">harness.continuation.set</text>
