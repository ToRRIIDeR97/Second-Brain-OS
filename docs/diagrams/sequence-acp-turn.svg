<text class="lbl" x="436" y="217" text-anchor="start">promote input · start snapshot</text>
<rect class="lblbg" x="381.9" y="241.0" width="171.2" height="13" rx="2"/>
<text class="lbl" x="467.5" y="251" text-anchor="middle">stream(instanceID, revision)</text>
