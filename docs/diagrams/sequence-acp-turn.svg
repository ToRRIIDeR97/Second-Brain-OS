<text class="lbl" x="780.0" y="441" text-anchor="middle">session/prompt (handoff transcript if new)</text>
<rect class="lblbg" x="715.0" y="463.0" width="129.9" height="13" rx="2"/>
<text class="lbl" x="780.0" y="473" text-anchor="middle">session/update chunks</text>
