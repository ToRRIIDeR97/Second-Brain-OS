<text class="lbl" x="545.0" y="503" text-anchor="middle">LLM events (stream)</text>
<rect class="lblbg" x="131.7" y="523.0" width="206.6" height="13" rx="2"/>
<text class="lbl" x="235.0" y="533" text-anchor="middle">durable events → SSE /global/event</text>
