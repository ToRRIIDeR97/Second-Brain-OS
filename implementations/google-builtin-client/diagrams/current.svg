<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="t d">
<title id="t">Current Google connect flow</title>
<desc id="d">The user pastes an OAuth client ID and secret on the Calendar page; the main process validates them and runs the browser sign-in.</desc>
<style>
rect{fill:#f4f4f5;stroke:#52525b;stroke-width:1.2}
text{font:13px system-ui,sans-serif;fill:#18181b}
.s{font-size:11px;fill:#52525b}
.bad{fill:#fef2f2;stroke:#b91c1c}
line{stroke:#52525b;stroke-width:1.2;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker></defs>
<rect class="bad" x="20" y="40" width="200" height="90" rx="10"/>
<text x="34" y="64">Calendar page</text>
<text class="s" x="34" y="84">app/src/pages/calendar.tsx</text>
<text class="s" x="34" y="102">client ID + secret fields (required)</text>
<text class="s" x="34" y="118">connectGoogle()</text>
<line x1="220" y1="85" x2="290" y2="85"/>
<text class="s" x="226" y="76">IPC connect</text>
<rect x="290" y="40" width="200" height="90" rx="10"/>
<text x="304" y="64">google-calendar.ts</text>
<text class="s" x="304" y="84">connect(): validateCredentials</text>
<text class="s" x="304" y="102">authorize() PKCE loopback</text>
<text class="s" x="304" y="118">writeConfig (safeStorage)</text>
<line x1="490" y1="85" x2="560" y2="85"/>
<rect x="560" y="40" width="180" height="90" rx="10"/>
<text x="574" y="64">Google OAuth</text>
<text class="s" x="574" y="84">browser consent</text>
<text class="s" x="574" y="102">token exchange</text>
<text class="s" x="34" y="170">Limitation: every user must create a Google Cloud project and</text>
<text class="s" x="34" y="188">Desktop OAuth client, then paste its ID and secret before signing in.</text>
</svg>
