<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="t d">
<title id="t">Proposed Google connect flow (proposed)</title>
<desc id="d">A build-time OAuth client from a git-ignored env file is compiled into the main process. The Calendar page shows one Sign in with Google button; typed credentials remain an advanced override.</desc>
<style>
rect{fill:#f4f4f5;stroke:#52525b;stroke-width:1.2}
text{font:13px system-ui,sans-serif;fill:#18181b}
.s{font-size:11px;fill:#52525b}
.new{fill:#eff6ff;stroke:#1d4ed8}
line{stroke:#52525b;stroke-width:1.2;marker-end:url(#a)}
.dash{stroke-dasharray:5 4}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker></defs>
<rect class="new" x="290" y="170" width="200" height="70" rx="10"/>
<text x="304" y="194">desktop/.env.local (ignored)</text>
<text class="s" x="304" y="212">MAIN_VITE_GOOGLE_CLIENT_ID</text>
<text class="s" x="304" y="228">MAIN_VITE_GOOGLE_CLIENT_SECRET</text>
<line class="dash" x1="390" y1="170" x2="390" y2="132"/>
<text class="s" x="396" y="156">compiled in at build (AC-1)</text>
<rect class="new" x="20" y="40" width="200" height="90" rx="10"/>
<text x="34" y="64">Calendar page</text>
<text class="s" x="34" y="84">builtInClient: Sign in with Google</text>
<text class="s" x="34" y="102">Advanced: own ID + secret (AC-6)</text>
<text class="s" x="34" y="118">else: current form</text>
<line x1="220" y1="85" x2="290" y2="85"/>
<text class="s" x="224" y="76">IPC connect</text>
<rect class="new" x="290" y="40" width="200" height="90" rx="10"/>
<text x="304" y="64">google-calendar.ts</text>
<text class="s" x="304" y="84">status(): builtInClient (AC-5)</text>
<text class="s" x="304" y="102">connect(): resolveGoogleClient</text>
<text class="s" x="304" y="118">authorize, writeConfig unchanged</text>
<line x1="490" y1="85" x2="560" y2="85"/>
<rect x="560" y="40" width="180" height="90" rx="10"/>
<text x="574" y="64">Google OAuth</text>
<text class="s" x="574" y="84">browser consent</text>
<text class="s" x="574" y="102">token exchange</text>
</svg>
