<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img"><title>Proposed: Phase 1 changes</title><desc>Model kept while the list loads; cross-provider tool history becomes text; closed clients fail fast and runtimes are replaced; any resume failure starts a new Codex thread.</desc><style>
.t{font:600 13px system-ui,sans-serif;fill:#1f2328}.s{font:12px system-ui,sans-serif;fill:#57606a}
.b{fill:#f6f8fa;stroke:#8c959f;stroke-width:.8}.bad{fill:#ffebe9;stroke:#cf222e;stroke-width:.8}
.new{fill:#dafbe1;stroke:#1a7f37;stroke-width:.8}.a{stroke:#8c959f;stroke-width:1.2;fill:none;marker-end:url(#m)}
@media (prefers-color-scheme:dark){.t{fill:#e6edf3}.s{fill:#9198a1}.b{fill:#161b22;stroke:#3d444d}
.bad{fill:#3a1d1f;stroke:#f85149}.new{fill:#12261a;stroke:#3fb950}.a{stroke:#9198a1}}
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#8c959f" stroke-width="1.5"/></marker></defs><rect x="20" y="20" width="220" height="50" rx="6" class="b"/><text class="t" x="130.0" y="39.0" text-anchor="middle">Composer</text><text class="s" x="130.0" y="57.0" text-anchor="middle">harness-controller</text><rect x="270" y="20" width="220" height="50" rx="6" class="b"/><text class="t" x="380.0" y="39.0" text-anchor="middle">Runner</text><text class="s" x="380.0" y="57.0" text-anchor="middle">session/runner/llm.ts</text><rect x="520" y="20" width="220" height="50" rx="6" class="b"/><text class="t" x="630.0" y="39.0" text-anchor="middle">HarnessRuntime</text><text class="s" x="630.0" y="57.0" text-anchor="middle">harness.ts</text><path class="a" d="M240 45 L268 45"/><path class="a" d="M490 45 L518 45"/><rect x="20" y="110" width="220" height="60" rx="6" class="new"/><text class="t" x="130.0" y="134.0" text-anchor="middle">Keep model while loading</text><text class="s" x="130.0" y="152.0" text-anchor="middle">AC-5 reconcileHarnessModel</text><rect x="270" y="110" width="220" height="60" rx="6" class="new"/><text class="t" x="380.0" y="134.0" text-anchor="middle">Other provider: as text</text><text class="s" x="380.0" y="152.0" text-anchor="middle">AC-1 toLLMMessages</text><rect x="520" y="110" width="220" height="60" rx="6" class="new"/><text class="t" x="630.0" y="134.0" text-anchor="middle">Closed client fails fast</text><text class="s" x="630.0" y="152.0" text-anchor="middle">AC-2 / AC-3 replace runtime</text><rect x="520" y="200" width="220" height="60" rx="6" class="new"/><text class="t" x="630.0" y="224.0" text-anchor="middle">Any resume error: new thread</text><text class="s" x="630.0" y="242.0" text-anchor="middle">AC-4 openCodexThread</text><path class="a" d="M130 70 L130 108"/><path class="a" d="M380 70 L380 108"/><path class="a" d="M630 70 L630 108"/><path class="a" d="M630 170 L630 198"/><text class="s" x="20" y="300">Green: proposed changes, each tied to its acceptance criterion. Same-provider server tools still round-trip.</text></svg>
