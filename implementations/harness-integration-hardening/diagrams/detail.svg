<defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#8c959f" stroke-width="1.5"/></marker></defs><rect x="20" y="20" width="350" height="56" rx="6" class="new"/><text class="t" x="195.0" y="42.0" text-anchor="middle">codex-app-server.ts make()</text><text class="s" x="195.0" y="60.0" text-anchor="middle">closed flag set in fail(); request() checks it (AC-2)</text><rect x="390" y="20" width="350" height="56" rx="6" class="new"/><text class="t" x="565.0" y="42.0" text-anchor="middle">acp.ts Session.closed</text><text class="s" x="565.0" y="60.0" text-anchor="middle">delegates to the client (AC-3)</text><rect x="20" y="100" width="350" height="56" rx="6" class="new"/><text class="t" x="195.0" y="122.0" text-anchor="middle">harness.ts getRuntime / getAcpRuntime</text><text class="s" x="195.0" y="140.0" text-anchor="middle">cached runtime closed? close + reopen (AC-3)</text><rect x="390" y="100" width="350" height="56" rx="6" class="new"/><text class="t" x="565.0" y="122.0" text-anchor="middle">harness.ts openCodexThread()</text><text class="s" x="565.0" y="140.0" text-anchor="middle">resume → on any error thread/start (AC-4)</text><rect x="20" y="180" width="350" height="56" rx="6" class="new"/><text class="t" x="195.0" y="202.0" text-anchor="middle">to-llm-message.ts assistant()</text><text class="s" x="195.0" y="220.0" text-anchor="middle">provider differs: tool → text, output ≤ 2,000 (AC-1)</text><rect x="390" y="180" width="350" height="56" rx="6" class="new"/><text class="t" x="565.0" y="202.0" text-anchor="middle">harness-controller reconcileHarnessModel()</text><text class="s" x="565.0" y="220.0" text-anchor="middle">no models or turn running → keep (AC-5)</text><path class="a" d="M195 76 L195 98"/><path class="a" d="M565 76 L565 98"/><text class="s" x="20" y="268">Tests: acceptance/core (AC-1, AC-2, AC-4), acceptance/app (AC-5); verification sets use other cases. AC-3: review only.</text></svg>
