<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 285" role="img"><title>Phase 1 implementation detail</title><desc>Functions changed in the JSON-RPC client, ACP session, runtime caches, Codex thread setup, history replay and model reconciliation, each mapped to its acceptance criterion.</desc><style>
